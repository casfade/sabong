<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Customer Order Menu V21</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#f5f5f3; --surface:#fff; --surface-soft:#ededeb; --text:#171717; --muted:#737373; --line:#e5e5e2; --black:#111;
  --danger:#c33; --success:#16834b;
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-7:32px;
  --content:28px; --control:44px;
  --text-xs:11px; --text-sm:12px; --text-md:14px; --text-lg:18px; --text-xl:28px; --text-display:32px;
  --shadow-sm:0 6px 20px rgba(0,0,0,.06); --shadow-md:0 18px 50px rgba(0,0,0,.12);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:var(--text-md);line-height:1.4;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--black);outline-offset:2px}
img{max-width:100%}.hidden{display:none!important}
h1,h2,h3,h4,p{margin:0}.hero h1,.cart-head h2,.modal h2{letter-spacing:-.05em}

.order-type-screen{position:fixed;inset:0;width:100vw;height:100dvh;padding:var(--s-6);display:flex;align-items:center;justify-content:center;gap:var(--s-4);background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;transition:opacity .18s var(--ease),visibility .18s var(--ease)}
.order-type-screen.hidden{display:flex!important;opacity:0;visibility:hidden;pointer-events:none}
.start-card{flex:0 0 min(300px,calc((100vw - 80px)/2));width:min(300px,calc((100vw - 80px)/2));aspect-ratio:1;border:1px solid rgba(0,0,0,.08);border-radius:var(--r-xl);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:clamp(28px,4vw,48px);font-weight:800;box-shadow:var(--shadow-md);transition:transform .12s ease,background .12s ease,color .12s ease}
.start-card:active{transform:scale(.985);background:var(--black);color:#fff}

.app{min-height:100vh}.layout{min-height:100vh}.highlight-carousel{width:100%;aspect-ratio:5/2;overflow:hidden;position:relative;background:#e8e8e5}.highlight-track{display:flex;width:100%;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}.highlight-track::-webkit-scrollbar{display:none}.highlight-slide{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start}.highlight-slide img{display:block;width:100%;height:100%;object-fit:cover}.highlight-dots{position:absolute;left:50%;bottom:var(--s-3);transform:translateX(-50%);display:flex;gap:6px;pointer-events:none}.highlight-dot{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.55);transition:width .18s ease}.highlight-dot.active{width:18px;background:#fff}

.menu-area{padding:var(--s-6) var(--content) 120px;min-width:0}.hero{margin-bottom:var(--s-3)}.hero h1{font-size:var(--text-display);line-height:1.05;font-weight:800}.tabs{display:flex;flex-wrap:nowrap;gap:var(--s-2);overflow-x:auto;overflow-y:hidden;padding:var(--s-3) 0 var(--s-4);position:sticky;top:0;z-index:15;background:var(--bg);scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;white-space:nowrap}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto}.tab{min-height:38px;padding:0 var(--s-4);border-radius:999px;border:1px solid var(--line);background:var(--surface);color:#555;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease,border-color .15s ease,transform .12s ease}.tab.active{background:var(--black);color:#fff;border-color:var(--black)}.tab:active{transform:scale(.97)}

.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-3);margin:var(--s-2) 0 var(--s-3)}.section-title h2{font-size:var(--text-lg);line-height:1.2;font-weight:800}.section-title span{font-size:var(--text-sm);color:var(--muted);font-weight:500}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:var(--s-3)}.product{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;min-width:0;transition:transform .12s ease,box-shadow .15s ease}.product:active{transform:scale(.985)}.photo{aspect-ratio:1;background:#ddd;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;left:0;right:0;top:0;border-radius:0;padding:11px 10px;text-align:center;font-size:11px;line-height:1.1;letter-spacing:.08em;font-weight:800;color:#fff;z-index:2}
.badge.red{background:#c62828}
.badge.blue{background:#2463c7}.product-info{padding:var(--s-4);min-height:132px;display:flex;flex-direction:column}.product-info h3{font-size:15px;line-height:1.2;font-weight:700;margin-bottom:var(--s-2)}.desc{font-size:var(--text-xs);line-height:1.4;color:var(--muted)}.price-row{margin-top:auto;padding-top:var(--s-3);display:flex;align-items:center;justify-content:space-between;gap:var(--s-2)}.price{font-size:13px;font-weight:800}.add{min-height:34px;padding:0 var(--s-3);background:var(--black);color:#fff;border-radius:var(--r-sm);font-size:11px;font-weight:800;pointer-events:none}

.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility .2s ease;z-index:39}.drawer-backdrop.open{opacity:1;visibility:visible;pointer-events:auto}body.drawer-open{overflow:hidden}.cart-panel{position:fixed;top:0;right:0;width:min(430px,100vw);height:100dvh;z-index:40;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s var(--ease);box-shadow:-18px 0 50px rgba(0,0,0,.12)}.cart-panel.open{transform:translateX(0)}.cart-head{padding:var(--s-5);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:var(--s-3)}.cart-head h2{font-size:32px;line-height:1;font-weight:800}.close-cart{width:48px;height:48px;display:grid;place-items:center;padding:0;background:transparent;color:var(--text);font-size:40px;line-height:1;border-radius:var(--r-sm)}.close-cart:active{background:var(--surface-soft)}.cart-items{padding:var(--s-3) var(--s-5);overflow:auto;flex:1;min-height:0}.empty{text-align:center;color:#888;padding:60px var(--s-3);font-size:13px}.cart-item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.cart-item-photo{width:56px;height:56px;border-radius:var(--r-sm);object-fit:cover;display:block}.cart-item-info{min-width:0}.cart-item-info h4{font-size:14px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cart-item-info small{display:block;margin-top:3px;font-size:11px;color:var(--muted)}.cart-item-total{font-size:14px;font-weight:800;white-space:nowrap;align-self:end;padding-bottom:4px}.qty{display:flex;align-items:center;gap:8px;margin-top:8px}.qty button{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:17px;line-height:1;display:grid;place-items:center}.qty span{min-width:14px;text-align:center;font-size:12px;font-weight:700}

.frequent-section{padding:var(--s-3) var(--s-5);border-top:1px solid var(--line);flex:0 0 auto;overflow:hidden}.frequent-heading{font-size:14px;font-weight:800;letter-spacing:-.02em;margin-bottom:var(--s-2)}.frequent-list{display:flex;gap:var(--s-2);overflow-x:auto;scrollbar-width:none;padding:2px 0 3px;scroll-snap-type:x proximity}.frequent-list::-webkit-scrollbar{display:none}.frequent-card{flex:0 0 132px;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface);cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px;scroll-snap-align:start}.frequent-card img{width:42px;height:42px;flex:0 0 42px;border-radius:var(--r-sm);object-fit:cover;display:block}.frequent-card-body{min-width:0}.frequent-card-name{font-size:11px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frequent-card-price{margin-top:3px;font-size:10px;color:var(--muted)}

.cart-bottom{padding:var(--s-5);border-top:1px solid var(--line);background:var(--surface)}.summary-row{display:flex;justify-content:space-between;align-items:center;gap:var(--s-3);font-size:13px;margin-bottom:var(--s-2)}.summary-row strong{font-weight:700}.summary-row.total{font-size:18px;font-weight:800;padding-top:var(--s-3);margin-top:var(--s-3);border-top:1px solid var(--line);margin-bottom:var(--s-4)}.checkout{width:100%;min-height:52px;border-radius:var(--r-md);background:var(--black);color:#fff;font-size:15px;font-weight:800}.checkout:disabled{opacity:.4;cursor:not-allowed}

.view-orders-bar{position:fixed;left:50%;bottom:var(--s-4);transform:translateX(-50%);width:min(520px,calc(100vw - 24px));min-height:68px;z-index:40;background:var(--black);color:#fff;border-radius:var(--r-lg);padding:var(--s-4) var(--s-5);display:flex;justify-content:space-between;align-items:center;gap:var(--s-4);box-shadow:0 10px 30px rgba(0,0,0,.16);font-size:16px}.view-orders-bar b{font-size:18px;font-weight:800}.view-orders-bar strong{font-size:16px;font-weight:800;white-space:nowrap}.view-orders-bar.added{animation:orderAdded .28s ease}@keyframes orderAdded{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.025)}100%{transform:translateX(-50%) scale(1)}}

.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.53);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:var(--s-5);z-index:200}.modal-wrap.show{display:flex}.modal{width:min(700px,100%);max-height:min(90dvh,760px);overflow:auto;background:var(--surface);border-radius:var(--r-xl);padding:var(--s-7);box-shadow:0 30px 80px rgba(0,0,0,.22)}.modal h2{font-size:34px;line-height:1.05;font-weight:800;margin-bottom:var(--s-1)}.modal p{color:var(--muted);font-size:13px}.receipt{border:1px dashed #bbb;padding:var(--s-5);margin:var(--s-5) 0;max-height:52vh;overflow:auto;font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.modal-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:var(--s-2)}.secondary,.primary{min-height:52px;padding:0 var(--s-4);border-radius:var(--r-md);font-weight:800}.secondary{background:var(--surface-soft);color:var(--text)}.primary{background:var(--black);color:#fff}.printer-status{display:none;margin-bottom:var(--s-4);padding:var(--s-3);border-radius:var(--r-sm);font-size:12px}.printer-status.show{display:block}.printer-status.error{background:#fff0f0;color:var(--danger)}.printer-status.success{background:#eefaf3;color:var(--success)}

@media(max-width:700px){
  :root{--content:12px}
  .order-type-screen{padding:var(--s-4);flex-direction:column;gap:var(--s-3)}.start-card{flex:0 0 min(260px,calc(100vw - 48px));width:min(260px,calc(100vw - 48px));font-size:34px}
  .menu-area{padding:var(--s-5) var(--content) 112px}.hero h1{font-size:28px}.tabs{margin-right:calc(var(--content) * -1);padding-right:var(--content)}.tab{min-height:36px;padding:0 14px;font-size:12px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product-info{padding:var(--s-3);min-height:120px}.product-info h3{font-size:14px}.desc{font-size:10.5px}.add{min-height:32px;padding:0 9px;font-size:10px}.cart-panel{left:0;right:0;width:100vw;border-left:0}.cart-head{padding:var(--s-4)}.cart-head h2{font-size:29px}.cart-items{padding:var(--s-3) var(--s-4)}.cart-bottom{padding:var(--s-4)}.frequent-section{padding:var(--s-3) var(--s-4)}.view-orders-bar{bottom:var(--s-3);width:calc(100vw - 24px);min-height:64px;padding:var(--s-3) var(--s-4)}.modal{padding:var(--s-5);border-radius:var(--r-lg)}.modal h2{font-size:29px}.receipt{font-size:12px;padding:var(--s-4)}}
@media(min-width:1200px){.menu-area{max-width:1400px;margin:0 auto;padding-left:40px;padding-right:40px}}
</style>
</head>
<body>

<section id="orderTypeScreen" class="order-type-screen">
  <button class="start-card" onclick="startOrder('Dine In')">Dine In</button>
  <button class="start-card" onclick="startOrder('Take Out')">Take Out</button>
</section>

<div class="app">
<main class="layout">
<div class="highlight-carousel" id="highlightCarousel" aria-label="Highlights">
  <div class="highlight-track" id="highlightTrack">

    <div class="highlight-slide"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSybd4cN8xNSVCd5hwIMbBVeNt1rf8t-HVCSTbDMXA0mQ&s=10" alt="" loading="lazy"></div>
    <div class="highlight-slide"><img src="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/15/00/b6/b3/sabong-fried-chicken.jpg?w=1100&h=1100&s=1" alt="" loading="lazy"></div>
    <div class="highlight-slide"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0J2fZsWM2x9Ug8QIh74VvT7UkxHKUFqezR-5Q8J2PRQ1b7v6Rh1NP_zhf&s=10" alt="" loading="lazy"></div>

  </div>
  <div class="highlight-dots" id="highlightDots" aria-hidden="true"></div>
</div>

<section class="menu-area">
<div class="hero"><h1 id="menuTitle">Dine In</h1></div>
<nav class="tabs" id="tabs"></nav>
<div id="menu"></div>
</section>

<div id="drawerBackdrop" class="drawer-backdrop" onclick="closeCart()"></div>
<aside class="cart-panel" id="cartPanel">
<div class="cart-head">
  <h2>Your Order</h2>
  <button class="close-cart" aria-label="Close order" onclick="closeCart()">×</button>
</div>
<div class="cart-items" id="cartItems"></div>
<div class="frequent-section" id="frequentSection"><div class="frequent-heading">Frequently Ordered With</div></div>
<div class="cart-bottom">
  <div class="summary-row"><span>Subtotal</span><strong id="subtotal">₱0.00</strong></div>
  <div class="summary-row"><span>Tax</span><strong>₱0.00</strong></div>
  <div class="summary-row total"><span>Total</span><span id="total">₱0.00</span></div>
  <button type="button" class="checkout" id="checkout" disabled>Check Out</button>
</div>
</aside>
</main>

<!-- CART SNACKBAR -->
<button class="view-orders-bar" id="viewOrdersBar" onclick="openCart()">
  <span><b id="snackCount">0</b> <span id="snackItemsWord">items</span> in your order</span>
  <strong>View Orders</strong>
</button>

</div>

<div class="modal-wrap" id="modal">
<div class="modal">
<h2>Check Out</h2>
<p id="modalMeta"></p>
<div class="receipt" id="receiptPreview"></div>
<div class="printer-status" id="printerStatus"></div>
<div class="modal-actions">
<button type="button" class="secondary" id="cancel">Back to Order</button>
<button type="button" class="primary" id="print">Print Order</button>
</div>
</div>
</div>

  ["bottled-water","Bottled Water","Drinks",30,"","", "https://images.unsplash.com/photo-1564419320461-6870880221ad?auto=format&fit=crop&w=700&q=80"]
].map(x=>({id:x[0],name:x[1],category:x[2],price:x[3],desc:x[4],tag:x[5],img:x[6]}));

let cart=[],orderType="Dine In",activeTab="Best Pick";
const categories=["Best Pick","Mains","Bucket","Sides","Extras","Drinks"];
const BEST_PICK_IDS=["honey-bagoong","korean-soy","bicol-express","sinigang-sa-batuwan"];


const money=n=>n===0?"Price not set":n.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});


function syncDrawerUI(open){
  const panel=document.getElementById("cartPanel");
  const backdrop=document.getElementById("drawerBackdrop");
  const bar=document.getElementById("viewOrdersBar");
  if(panel)panel.classList.toggle("open",open);
  if(backdrop)backdrop.classList.toggle("open",open);
  document.body.classList.toggle("drawer-open",open);
  if(bar)bar.style.display=open?"none":"";
}

function openCart(){
  syncDrawerUI(true);
  if(history.state?.orderDrawer!==true){
    history.pushState({orderDrawer:true},"","#order");
  }
}
function closeCart(fromPopState=false){
  syncDrawerUI(false);
  if(!fromPopState && history.state?.orderDrawer===true){
    history.back();
  }
}

function startOrder(type){
  orderType=type;

  const title=document.getElementById("menuTitle");
  if(title) title.textContent=type;

  // The Dine In / Take Out screen is an overlay, not a separate page.
  const modal=document.getElementById("orderTypeScreen");
  if(modal) modal.classList.add("hidden");

  // The order page is already underneath the modal.
  const app=document.querySelector(".app");
  if(app) app.classList.remove("hidden");

  closeCart();
  cart=[];
  renderCart();
  renderTabs();
  renderMenu();
}

function visibleProducts(){
 if(activeTab==="Best Pick")return MENU.filter(x=>BEST_PICK_IDS.includes(x.id));
 return MENU.filter(x=>x.category===activeTab);
}
function renderTabs(){
 document.getElementById("tabs").innerHTML=categories.map(c=>`<button class="tab ${c===activeTab?"active":""}" onclick="setTab('${c}')">${c}</button>`).join("");
}
function setTab(t){activeTab=t;renderTabs();renderMenu()}
function renderMenu(){
 const p=visibleProducts();
 document.getElementById("menu").innerHTML=`<div class="section-title"><h2>${activeTab}</h2><span>${p.length} items</span></div><div class="products">${p.map(x=>`
 <article class="product" onclick="addItem('${x.id}')">
  <div class="photo"><img src="${x.img}" alt="${x.name}" loading="lazy">${x.tag?`<span class="badge ${x.tag.toLowerCase()}">${x.tag==="Red"?"3 PCS FRIED CHICKEN":"BONELESS CHICKEN"}</span>`:""}</div>
  <div class="product-info"><h3>${BEST_PICK_IDS.includes(x.id)?'★ ':''}${x.name}</h3><div class="desc">${x.desc}</div><div class="price-row"><span class="price">${money(x.price)}</span><button class="add" tabindex="-1">Add</button></div></div>
 </article>`).join("")}</div>`;
}
function addItem(id){
 const p=MENU.find(x=>x.id===id),e=cart.find(x=>x.id===id);
 if(!p)return;
 if(e)e.qty++;else cart.push({id:p.id,name:p.name,price:p.price,qty:1,img:p.img});
 renderCart();

 const bar=document.getElementById("viewOrdersBar");
 bar.classList.remove("added");
 void bar.offsetWidth;
 bar.classList.add("added");
}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderCart()}
function renderCart(){
 const count=cart.reduce((a,x)=>a+x.qty,0),sub=cart.reduce((a,x)=>a+x.price*x.qty,0);
 document.getElementById("snackCount").textContent=count;
 document.getElementById("snackItemsWord").textContent=count===1?"item":"items";
 document.getElementById("subtotal").textContent=money(sub);
 document.getElementById("total").textContent=money(sub);
 document.getElementById("checkout").disabled=!cart.length;
 document.getElementById("cartItems").innerHTML=cart.length?cart.map((x,i)=>`<div class="cart-item"><img class="cart-item-photo" src="${x.img}" alt="${x.name}" loading="lazy"><div class="cart-item-info"><h4>${x.name}</h4><small>${money(x.price)} each</small><div class="qty"><button onclick="changeQty(${i},-1)" aria-label="Decrease ${x.name}">−</button><span>${x.qty}</span><button onclick="changeQty(${i},1)" aria-label="Increase ${x.name}">+</button></div></div><strong class="cart-item-total">${money(x.price*x.qty)}</strong></div>`).join(""):`<div class="empty">Your order is empty.<br><br>Tap a menu item to begin.</div>`;
}
function createReceipt(){
 const sub=cart.reduce((a,x)=>a+x.price*x.qty,0);
 let s="SABONG FRIED CHICKEN\n------------------------------\n"+orderType.toUpperCase()+"\n"+new Date().toLocaleString("en-PH")+"\n------------------------------\n";
 cart.forEach(x=>s+=`${x.qty} x ${x.name}\n    ${money(x.price*x.qty)}\n`);
 return s+"------------------------------\nTOTAL: "+money(sub)+"\n------------------------------\nPlease bring this order slip to the cashier.\n\n\n\n";
}
function openCheckout(){
 document.getElementById("modalMeta").textContent=`${orderType} · ${cart.reduce((a,x)=>a+x.qty,0)} items · ${document.getElementById("total").textContent}`;
 document.getElementById("receiptPreview").textContent=createReceipt();
 document.getElementById("modal").classList.add("show");
}
function finishOrder(){
 cart=[];renderCart();
 closeCart();
 document.getElementById("modal").classList.remove("show");
 document.querySelector(".app").classList.remove("hidden");
 document.getElementById("orderTypeScreen").classList.remove("hidden");
}
function clearStatus(){
  const e=document.getElementById("printerStatus");
  if(!e)return;
  e.className="printer-status";
  e.textContent="";
}
function status(message,type){
  const e=document.getElementById("printerStatus");
  if(!e)return;
  e.className="printer-status show "+(type||"");
  e.textContent=message;
}

async function nativePrint(receipt){
  if(window.Android && typeof window.Android.printReceipt==="function"){
    const result=await Promise.resolve(window.Android.printReceipt(receipt));
    if(result && String(result).toLowerCase()==="error") throw new Error("Android printer error");
    return true;
  }
  return false;
}

let bluetoothDevice=null;
let bluetoothCharacteristic=null;

async function connectWebBluetoothPrinter(){
  if(!navigator.bluetooth) throw new Error("Bluetooth printing is not supported in this browser.");

  // Reuse a device that this browser has already authorized whenever possible.
  if(navigator.bluetooth.getDevices){
    const devices=await navigator.bluetooth.getDevices();
    for(const device of devices){
      bluetoothDevice=device;
      try{
        const server=await bluetoothDevice.gatt.connect();
        const services=await server.getPrimaryServices();
        for(const service of services){
          const chars=await service.getCharacteristics();
          for(const characteristic of chars){
            if(characteristic.properties.write||characteristic.properties.writeWithoutResponse){
              bluetoothCharacteristic=characteristic;
              return true;
            }
          }
        }
      }catch(e){
        bluetoothCharacteristic=null;
      }
    }
  }

  // Only ask the user when there is no previously authorized device.
  bluetoothDevice=await navigator.bluetooth.requestDevice({
    acceptAllDevices:true,
    optionalServices:[0xFFE0,0xFFE1,0x18F0]
  });
  bluetoothDevice.addEventListener("gattserverdisconnected",()=>{bluetoothCharacteristic=null;});
  const server=await bluetoothDevice.gatt.connect();
  const services=await server.getPrimaryServices();
  for(const service of services){
    const chars=await service.getCharacteristics();
    for(const characteristic of chars){
      if(characteristic.properties.write||characteristic.properties.writeWithoutResponse){
        bluetoothCharacteristic=characteristic;
        return true;
      }
    }
  }
  throw new Error("No writable Bluetooth printer characteristic was found.");
}

async function webBluetoothPrint(receipt){
  if(!bluetoothCharacteristic) await connectWebBluetoothPrinter();
  const bytes=new TextEncoder().encode("\x1B\x40"+receipt+"\n\n\n\x1D\x56\x00");
  const chunkSize=180;
  for(let i=0;i<bytes.length;i+=chunkSize){
    const chunk=bytes.slice(i,i+chunkSize);
    if(bluetoothCharacteristic.properties.writeWithoutResponse){
      await bluetoothCharacteristic.writeValueWithoutResponse(chunk);
    }else{
      await bluetoothCharacteristic.writeValue(chunk);
    }
  }
}

async function printOrder(){
  if(!cart.length) return;
  const receipt=createReceipt();
  const button=document.getElementById("print");
  clearStatus();
  button.disabled=true;
  button.textContent="Printing...";

  try{
    // V2-compatible native path first.
    const native=await nativePrint(receipt);
    if(!native){
      // V2-compatible BLE fallback, but reuse already-authorized devices first.
      await webBluetoothPrint(receipt);
    }
    status("Order sent to printer.","success");
    setTimeout(()=>finishOrder(),700);
  }catch(error){
    console.error("Print Order:",error);
    status(error?.message||"Unable to print the order.","error");
  }finally{
    button.disabled=false;
    button.textContent="Print Order";
  }
}

document.getElementById("checkout").addEventListener("click",function(e){
  e.preventDefault();
  e.stopPropagation();
  if(cart.length) openCheckout();
});
document.getElementById("cancel").addEventListener("click",function(e){

  document.getElementById("modal").classList.remove("show");
});
document.getElementById("print").addEventListener("click",function(e){

window.addEventListener("popstate",function(){
  if(document.getElementById("cartPanel")?.classList.contains("open")){
    closeCart(true);

});




(function(){
  const track=document.getElementById("highlightTrack"),dots=document.getElementById("highlightDots");
  if(!track||!dots)return;
  const slides=[...track.querySelectorAll(".highlight-slide")];
  slides.forEach((_,i)=>{const d=document.createElement("span");d.className="highlight-dot"+(i===0?" active":"");dots.appendChild(d)});
  const update=()=>{const n=Math.round(track.scrollLeft/Math.max(1,track.clientWidth));[...dots.children].forEach((d,i)=>d.classList.toggle("active",i===n))};
  track.addEventListener("scroll",update,{passive:true});
  let timer=setInterval(()=>{if(document.hidden)return;const n=(Math.round(track.scrollLeft/Math.max(1,track.clientWidth))+1)%slides.length;track.scrollTo({left:n*track.clientWidth,behavior:"smooth"})},5000);
  track.addEventListener("touchstart",()=>clearInterval(timer),{passive:true});
  track.addEventListener("touchend",()=>{clearInterval(timer);timer=setInterval(()=>{if(document.hidden)return;const n=(Math.round(track.scrollLeft/Math.max(1,track.clientWidth))+1)%slides.length;track.scrollTo({left:n*track.clientWidth,behavior:"smooth"})},5000)},{passive:true});
})();

function renderFrequentlyOrdered(){
  const section=document.getElementById("frequentSection");
  if(!section)return;

  const categories=["Drinks","Sides","Mains"];
  const items=categories.flatMap(category=>MENU.filter(p=>p.category===category)
    .sort((a,b)=>{
      const rank=p=>/best seller/i.test(p.tag)?0:/must try/i.test(p.tag)?1:2;
      return rank(a)-rank(b);
    }).slice(0,2));

  section.innerHTML=`<div class="frequent-heading">Frequently Ordered With</div><div class="frequent-list">${items.map(p=>`
    <div class="frequent-card" onclick="addItem('${p.id}')">
      <img src="${p.img}" alt="${p.name}" loading="lazy">
      <div class="frequent-card-body">
        <div class="frequent-card-name">${p.name}</div>
        <div class="frequent-card-price">${money(p.price)}</div>
      </div>
    </div>`).join("")}</div>`;
}


/* Reliable tab swipe */
(function(){
  let startX=0,startY=0,startTime=0;
  let tracking=false;

  function getTabs(){
    return [...document.querySelectorAll(".tabs button")];
  }

  function moveTab(direction){
    const tabs=getTabs();
    if(!tabs.length)return;
    let current=tabs.findIndex(t=>t.classList.contains("active"));
    if(current<0)current=0;

    const target=current+direction;
    if(target<0 || target>=tabs.length)return;

    tabs[target].click();
    tabs[target].scrollIntoView({
      behavior:"smooth",
      block:"nearest",
      inline:"center"
    });
  }

  document.addEventListener("touchstart",function(e){
    if(e.touches.length!==1)return;
    if(document.getElementById("cartPanel")?.classList.contains("open"))return;

    const target=e.target;
    // Do not hijack swipes on the highlight carousel or controls.
    if(target.closest(".highlight-carousel") || target.closest("button") || target.closest("a"))return;

    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    startTime=performance.now();
    tracking=true;
  },{passive:true});

  document.addEventListener("touchend",function(e){
    if(!tracking)return;
    tracking=false;

    if(document.getElementById("cartPanel")?.classList.contains("open"))return;

    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    const dt=performance.now()-startTime;

    if(dt>800)return;
    if(Math.abs(dx)<70)return;
    if(Math.abs(dx)<=Math.abs(dy)*1.35)return;

    // Right = next tab, Left = previous tab.
    moveTab(dx>0 ? 1 : -1);
  },{passive:true});
})();
